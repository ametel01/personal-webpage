name: Live SEO retrieval smoke

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-seo-retrieval-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Smoke AI crawler retrieval against production
        run: bun run test:ai-crawlers
        env:
          SEO_BASE_URL: https://www.ametel.dev
